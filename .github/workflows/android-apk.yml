name: Android APK

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "supabase/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build installable Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      # These are public client-side Supabase values, not server secrets.
      # Never put the Supabase service_role or Secret key here.
      SUPABASE_URL: https://ujcmpxctdzbuazudbzxt.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_XCYeISBDiVEUnV_NxZXXTw_C1Mxoxci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        working-directory: app
        run: flutter create --platforms=android --org ru.teplitsapro .

      - name: Apply ТЕПЛИЦА PRO Android branding
        working-directory: app
        run: |
          mkdir -p android/app/src/main/res
          cp -R tooling/android/res/* android/app/src/main/res/
          sed -i 's/android:label="[^"]*"/android:label="ТЕПЛИЦА PRO"/' android/app/src/main/AndroidManifest.xml

      - name: Configure scheduled alarm notifications
        working-directory: app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()
          permissions = """
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>
          """
          if "android.permission.RECEIVE_BOOT_COMPLETED" not in xml:
              xml = xml.replace("<application", permissions + "\n    <application", 1)
          receivers = """
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          """
          if "ScheduledNotificationReceiver" not in xml:
              xml = xml.replace("</application>", receivers + "\n    </application>", 1)
          manifest.write_text(xml)

          gradle = Path("android/app/build.gradle.kts")
          if gradle.exists():
              text = gradle.read_text()
              if "isCoreLibraryDesugaringEnabled" not in text:
                  text = text.replace(
                      "compileOptions {",
                      'compileOptions {\n        isCoreLibraryDesugaringEnabled = true',
                      1
                  )
              dependency = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if dependency not in text:
                  if "dependencies {" in text:
                      text = text.replace("dependencies {", "dependencies {\n    " + dependency, 1)
                  else:
                      text += "\n\ndependencies {\n    " + dependency + "\n}\n"
              gradle.write_text(text)
          PY

      - name: Validate SQL migration manifest
        run: python -m unittest discover -s supabase/tests -v

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app
        run: flutter analyze

      - name: Run Flutter widget tests
        working-directory: app
        run: flutter test

      - name: Build debug APK
        working-directory: app
        run: >
          flutter build apk --debug
          --dart-define=SUPABASE_URL=${SUPABASE_URL}
          --dart-define=SUPABASE_PUBLISHABLE_KEY=${SUPABASE_PUBLISHABLE_KEY}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: teplitsa-pro-android-apk-${{ github.run_number }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-test-${GITHUB_RUN_NUMBER}"
          APK="app/build/app/outputs/flutter-apk/app-debug.apk"
          ASSET="TeplitsaPro-Android-debug.apk"
          NOTES="Тестовая Android-сборка ТЕПЛИЦА PRO. Это debug APK для установки на собственный тестовый телефон. Не использовать для production."

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing its APK asset."
            gh release upload "$TAG" "$APK#$ASSET" --clobber
          else
            gh release create "$TAG" "$APK#$ASSET" \
              --title "ТЕПЛИЦА PRO — Android test build #${GITHUB_RUN_NUMBER}" \
              --notes "$NOTES" \
              --prerelease
          fi
